name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang make universal-ctags

      - name: Test bootstrap script
        run: |
          chmod +x bootstrap.sh
          ./bootstrap.sh

      - name: Verify generated tooling files
        run: |
          test -f tags

      - name: Build release target
        run: make

      - name: Run application
        run: ./build/bin/program
